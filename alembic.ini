# Alembic — миграции сервера дашборда (§6: server\migrations)
# URL подключения берётся из server/config.py (переменная окружения MAGAZ_DATABASE_URL),
# значение ниже — заглушка, env.py её перезаписывает.

[alembic]
script_location = server/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///server/data/magaz.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
